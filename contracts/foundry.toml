[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["vendor"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
ffi = true
gas_limit = "18446744073709551615"
fs_permissions = [{ access = "read", path = "./fixtures" }]
remappings = [
    "forge-std/=vendor/forge-std/src/",
    "pq-verifier-interface/=vendor/pq-verifier-interface/",
]

[fmt]
line_length = 110
